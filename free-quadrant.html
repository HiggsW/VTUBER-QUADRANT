<style>

*{box-sizing:border-box}
html,body{height:100%}

.serif{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",system-ui,sans-serif}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;height:100vh;padding:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.main{background:transparent;border:none;box-shadow:none;overflow:visible}

.controls input,.controls select,.controls button{width:100%;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;color:var(--ink)}

.list{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:0}
.member{display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#fff;transition:.15s ease}

.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;user-select:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.member .meta{min-width:0}
.member strong,.member span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member strong{font-size:14px}
.member span{font-size:12px;color:var(--muted)}
.member small{padding:2px 7px;border-radius:999px;background:#f5f0f2;color:#675f68;font-size:11px}
.main{display:flex;flex-direction:column;min-height:0;padding:10px 10px 0}

.topbar h2{margin:0 0 4px;font-size:19px;font-weight:600;color:#3a3940}

.topbar .btns{display:flex;gap:8px;flex-wrap:wrap}
.toolbtn{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;color:#403c43}
.toolbtn:hover{border-color:#d7bcc6;background:#fff9fb}
.stage{flex:1;min-height:0;display:flex;padding:0}
.board{position:relative;flex:1;width:100%;height:100%;min-height:0;background:transparent;border:none;border-radius:28px;box-shadow:none;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#f6eaf0 0 50%,#e8f0f7 50% 100%)}
.board::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0 50%,transparent 50% 100%)}
.board-frame{position:absolute;inset:0;border-radius:28px;box-shadow:inset 0 0 0 1px rgba(95,92,102,.16);pointer-events:none;z-index:1}
.board-credit{position:absolute;right:16px;bottom:11px;z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:#707078;letter-spacing:.025em}.board-credit .byline{font-size:9px;font-weight:400;opacity:.48}.board-credit .dept{font-size:12px;font-weight:400;opacity:.48}

.quad-overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0 50%,rgba(237,232,246,.92) 50% 100%),linear-gradient(90deg,transparent 0 50%,rgba(232,241,233,.92) 50% 100%);mix-blend-mode:multiply;opacity:.96}
.axis-svg{position:absolute;inset:0;pointer-events:none}
.axis-label{position:absolute;z-index:2;font-weight:600;color:var(--deep);text-shadow:none;letter-spacing:.01em;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",system-ui,sans-serif}
.axis-label.top{top:26px;left:50%;transform:translateX(-50%);font-size:clamp(17px,1.45vw,24px)}
.axis-label.bottom{bottom:24px;left:50%;transform:translateX(-50%);font-size:clamp(17px,1.45vw,24px)}
.axis-label.left{left:24px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:clamp(16px,1.35vw,22px)}
.axis-label.right{right:24px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:clamp(16px,1.35vw,22px)}
.board-hint{position:absolute;inset:auto 0 14px 0;text-align:center;z-index:2;color:#8f8a92;font-size:11.5px;pointer-events:none;letter-spacing:.02em}
.placed-layer{position:absolute;inset:0;z-index:4}
.card{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;min-width:92px;max-width:170px;touch-action:none;user-select:none}
.card.selected .avatar{outline:3px solid rgba(229,57,85,.18)}
.card .avatar{width:64px;height:64px;font-size:15px;box-shadow:0 8px 18px rgba(70,40,50,.12)}
.card .name{font-size:13px;font-weight:700;text-align:center;line-height:1.2;padding:0 4px;word-break:break-word}
.card .sub{font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding:0 4px}
.card .note{font-size:12px;line-height:1.35;text-align:center;color:#55545a;background:none;border:0;border-radius:0;padding:0;max-width:180px;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;max-height:4.05em;text-overflow:ellipsis;overflow-wrap:anywhere;box-shadow:none;cursor:pointer}
.card .note-editor-wrap{display:flex;flex-direction:column;gap:3px;width:164px;min-width:0}.card .note-input{display:block;box-sizing:border-box;width:100%;min-height:76px;max-height:150px;resize:vertical;overflow:auto;border:1px solid #e4cfd9;border-radius:10px;background:rgba(255,255,255,.97);padding:7px 8px;font-size:12px;line-height:1.45;font-family:inherit;color:#49414a;text-align:left;touch-action:auto;user-select:text;outline-offset:2px;box-shadow:0 4px 12px rgba(70,40,50,.05)}.card .note-input:focus{outline:2px solid #eeafc0}.card .note-count{font-size:10px;line-height:1.2;color:#99909a;text-align:right;white-space:nowrap}.card .edit-row{display:flex;align-items:flex-start;gap:4px}.card .confirm-note{border:0;border-radius:0;padding:4px 5px;background:transparent;color:#59605f;font-weight:500;font-size:20px;cursor:pointer}.card .confirm-note:hover{color:#222}.card .tools{display:none;position:absolute;top:-12px;right:-4px;gap:4px}
.card.selected .tools{display:flex}
.iconbtn{width:26px;height:26px;border-radius:999px;border:1px solid #e6d7de;background:#fff;color:#665f68;display:grid;place-items:center;padding:0;box-shadow:0 4px 10px rgba(70,40,50,.06)}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:#8c8790;z-index:1;pointer-events:none;font-size:13px;line-height:1.7}

<body>
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="app">
  <aside class="panel sidebar" id="mobileDrawer">
    <div class="drawer-handle"></div>
    <div class="side-head">
      
      <p>选择你愿意观看的主播或直播主，拖进四象限，记录你的观看偏好。</p>
    </div>
    <div class="controls">
      <input id="search" class="search" type="search" placeholder="搜索主播：日文 / English / 中文">
      <select id="branch" aria-label="所属团体"><option value="all">全部主播</option><option value="NIJISANJI">NIJISANJI</option><option value="VSPO">VSPO!</option><option value="CR">Crazy Raccoon</option><option value="NEO">Neo-Porte</option></select>
      <select id="status"><option value="all">全部状态</option><option value="placed">只看已放置</option><option value="unplaced">只看未放置</option></select>
      <div class="actions"><button id="toggleSort">按名称排序</button><button id="help">说明</button></div>
    </div>
    <div id="list" class="list"></div>
  </aside>

  <main class="panel main">
    <div class="topbar">
      <div>
        <h2>自由四象限</h2>
        <p>自定义上下左右的文字，选择主播并拖入画布，自由安排位置。</p>
      </div>
      <div class="btns">

const AXIS_LABELS_KEY = 'vtuber-free-quadrant-axis-labels-v1';

function getAxisLabels(){
  return Object.fromEntries(Object.entries(axisInputs).map(([key,input])=>[key,input.value.trim() || AXIS_DEFAULTS[key]]));
}
function applyAxisLabels(labels=getAxisLabels()){
  document.querySelector('.axis-label.top').textContent=labels.top;
  document.querySelector('.axis-label.bottom').textContent=labels.bottom;
  document.querySelector('.axis-label.left').textContent=labels.left;
  document.querySelector('.axis-label.right').textContent=labels.right;
}

}catch(e){}

  applyAxisLabels();
  try{localStorage.setItem(AXIS_LABELS_KEY,JSON.stringify(getAxisLabels()));}catch(e){}
}));

  for(const [key,input] of Object.entries(axisInputs)) input.value=AXIS_DEFAULTS[key];

function normalizeOshiIds(obj, placements){
  const candidates = Array.isArray(obj?.oshiIds) ? obj.oshiIds : (obj?.oshiId ? [obj.oshiId] : []);
  return [...new Set(candidates.filter(id => placements?.[id]))].slice(0,2);
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return {placements:{},oshiIds:[]};
    const obj = JSON.parse(raw);
    const placements = obj.placements || {};
    return {placements, oshiIds: normalizeOshiIds(obj, placements)};
  }catch(e){return {placements:{},oshiIds:[]};}
}

function representativeColor(m){ return REPRESENTATIVE_COLORS[m.jp] || REPRESENTATIVE_COLORS[m.en] || null; }
function tintRepresentativeColor(hex, whiteRatio=0.72){
  const h=String(hex||'').replace('#',''); if(!/^[0-9a-fA-F]{6}$/.test(h)) return '#f1eff2';
  const rgb=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
  return '#'+rgb.map(v=>Math.round(v*(1-whiteRatio)+255*whiteRatio).toString(16).padStart(2,'0')).join('');
}
function avatarBackground(m,hasImage=true){
  const rep=representativeColor(m);
  if(rep) return tintRepresentativeColor(rep);
  // No verified personal color: transparent artwork gets a neutral base instead of an invented color.
  return hasImage ? '#f1eff2' : colorFromText(m.id+m.jp);
}
function colorFromText(t){let h=0; for(const ch of t) h=(h*31 + ch.codePointAt(0))%360; return `hsl(${h}, 62%, 56%)`;}
function avatarLabel(m){if(m.en){const p=m.en.replace(/[^A-Za-z\s]/g,'').trim().split(/\s+/).filter(Boolean); if(p.length>=2) return (p[0][0]+p[1][0]).toUpperCase(); if(p.length===1) return p[0].slice(0,2).toUpperCase();} return (m.jp||m.cn||'?').replace(/[\s・·]/g,'').slice(0,2);}
function avatarHtml(m){
  const localPath = AVATAR_FILES[m.id] ? 'avatars/' + m.id + '.webp' : '';
  const src = avatarStore[m.id] || localPath;
  const label = escapeHtml(avatarLabel(m));
  return src ? `<img src="${escapeHtml(src)}" alt="${escapeHtml(m.jp)}" loading="lazy" onerror="this.remove();this.parentElement.style.background='${colorFromText(m.id+m.jp)}';this.parentElement.textContent='${label}'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : label;
}

function clamp(v,min,max){return Math.max(min, Math.min(max,v));}

function renderList(){
  const q = normalize($('#search').value);
  const branch = $('#branch').value;
  const status = $('#status').value;
  let arr=[...MEMBERS].sort((a,b)=>{
    const ka=normalize(a.jp||a.en||a.cn); const kb=normalize(b.jp||b.en||b.cn);
    return asc ? ka.localeCompare(kb,'ja') : kb.localeCompare(ka,'ja');
  });
  listEl.innerHTML='';
  for(const m of arr){
    const placed = !!state.placements[m.id];
    if(q && !searchBlob(m).includes(q)) continue;
    if(branch!=='all' && (branch==='NIJISANJI' ? !['JP','EN'].includes(m.branch) : m.branch!==branch)) continue;
    if(status==='placed' && !placed) continue;
    if(status==='unplaced' && placed) continue;
    const el=document.createElement('div');
    el.className='member';
    el.draggable=true;
    el.dataset.id=m.id;
    if(mobilePickedId===m.id)el.classList.add('is-picked');
    el.addEventListener('click',()=>{if(!isMobile())return;mobilePickedId=m.id;closeDrawer();updateMobilePick();});
    el.innerHTML=`<div class="avatar" style="background:${avatarBackground(m,!!(avatarStore[m.id] || AVATAR_FILES[m.id]))}">${avatarHtml(m)}</div>
      <div class="meta"><strong>${escapeHtml(m.jp)}</strong><span>${escapeHtml(m.en||m.cn||'—')}</span></div>
      <small>${placed?'已放置':(m.branch==='JP'||m.branch==='EN'?'NIJI '+m.branch:m.branch==='VSPO'?'VSPO!':m.branch==='NEO'?'Neo-Porte':'CR')}</small>`;
    el.addEventListener('contextmenu', e=>{e.preventDefault();uploadAvatar(m.id);});
    el.addEventListener('dragstart', e=>{el.classList.add('dragging'); e.dataTransfer.setData('text/plain', m.id);});
    el.addEventListener('dragend', ()=>el.classList.remove('dragging'));
    listEl.appendChild(el);
  }
}

function uploadAvatar(id){
  const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='image/*';
  fileInput.addEventListener('change',()=>{
    const file=fileInput.files?.[0];if(!file)return;
    if(file.size>3*1024*1024){alert('请上传小于 3 MB 的头像。');return;}
    const reader=new FileReader();reader.onload=()=>{
      avatarStore[id]=String(reader.result);
      try{localStorage.setItem('nijisanji-avatar-images-v1',JSON.stringify(avatarStore));renderPlaced();}
      catch(e){delete avatarStore[id];alert('浏览器本地存储空间不足，请尝试更小的头像图片。');}
    };reader.readAsDataURL(file);
  });fileInput.click();
}
function updateSelectionBar(){
  const bar=document.getElementById('selectionBar');
  if(!selectedId || !state.placements[selectedId]){bar.hidden=true;return;}
  const m=memberById(selectedId);
  if(!m){bar.hidden=true;return;}
  bar.hidden=false;
  document.getElementById('selectionName').textContent=m.jp;
  const button=document.getElementById('selectionOshi');
  const active=state.oshiIds.includes(selectedId);
  button.textContent=active?'取消神推':'设为神推';
  button.classList.toggle('is-active',active);
  button.setAttribute('aria-pressed',String(active));
}
document.getElementById('selectionOshi').addEventListener('click',()=>{
  if(!selectedId || !state.placements[selectedId])return;
  const current = state.oshiIds || [];
  if(current.includes(selectedId)){
    state.oshiIds = current.filter(id=>id!==selectedId);
  }else{
    if(current.length>=2){alert('神推最多设置两位哦！如需更换，请先取消其中一位。');return;}
    state.oshiIds = [...current, selectedId];
  }
  saveState();renderPlaced();
});

});
document.getElementById('selectionClose').addEventListener('click',()=>{

function renderPlaced(){
  placedEl.innerHTML='';
  let layerIndex=10;
  for(const [id,pl] of Object.entries(state.placements)){
    const m=memberById(id); if(!m) continue;
    const card=document.createElement('div');
    card.className='card'+(selectedId===id?' selected':'')+(state.oshiIds.includes(id)?' is-oshi':'');
    card.dataset.id=id;
    card.style.left=pl.x+'%'; card.style.top=pl.y+'%';
    card.style.zIndex=String(layerIndex++);
    card.innerHTML=`<div class="tools"><button class="iconbtn remove" title="移除">×</button></div>
      <div class="oshi-avatar-wrap"><div class="avatar" style="background:${avatarBackground(m,!!(avatarStore[m.id] || AVATAR_FILES[m.id]))}">${avatarHtml(m)}</div>${state.oshiIds.includes(id)?`<svg class="oshi-arc" viewBox="0 0 100 100" aria-label="神推"><defs><path id="oshiPath-${escapeHtml(id)}" d="M 49 9 A 41 41 0 0 1 92 50" /></defs><text><textPath href="#oshiPath-${escapeHtml(id)}" startOffset="50%" text-anchor="middle">神推</textPath></text></svg>`:''}</div>
      <div class="name">${escapeHtml(quadrantDisplayName(m))}</div>
      <div class="note-slot"></div>`;
    card.querySelector('.remove').addEventListener('click',e=>{e.stopPropagation();removePlacement(id);});
    const slot=card.querySelector('.note-slot');
    function showNote(){
      slot.innerHTML='';
      if(card.editAbort)card.editAbort.abort();
      const label=document.createElement('div');
      label.className='note';
      label.textContent=state.placements[id]?.note||'';
      label.title='点击编辑推荐理由';
      label.addEventListener('pointerdown',e=>e.stopPropagation());
      label.addEventListener('click',e=>{e.stopPropagation();showEdit();});
      slot.appendChild(label);
    }
    function showEdit(){
      slot.innerHTML='';
      const row=document.createElement('div');row.className='edit-row';
      if(card.editAbort)card.editAbort.abort();
      const editAbort=new AbortController();card.editAbort=editAbort;
      const editorWrap=document.createElement('div');editorWrap.className='note-editor-wrap';
      const input=document.createElement('textarea');input.className='note-input';input.maxLength=300;input.rows=3;
      input.value=state.placements[id]?.note||'';input.placeholder='输入推荐理由…（最多300字，可换行）';
      const count=document.createElement('div');count.className='note-count';count.textContent=input.value.length+'/300';
      input.addEventListener('input',()=>{count.textContent=input.value.length+'/300';});
      const ok=document.createElement('button');ok.className='confirm-note';ok.textContent='√';ok.title='保存推荐理由';
      let finished=false;
      function save(){if(finished)return;finished=true;editAbort.abort();if(!state.placements[id])return;state.placements[id].note=input.value.trim();saveState();showNote();}
      function cancel(){if(finished)return;finished=true;editAbort.abort();showNote();}
      function onOutside(e){if(!row.contains(e.target))save();}
      document.addEventListener('pointerdown',onOutside,{capture:true,signal:editAbort.signal});
      input.addEventListener('blur',()=>setTimeout(()=>{if(!row.contains(document.activeElement))save();},0));
      input.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();cancel();}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();save();}});
      ok.addEventListener('click',e=>{e.stopPropagation();save();});
      for(const el of [row,editorWrap,input,count,ok])el.addEventListener('pointerdown',e=>e.stopPropagation());
      editorWrap.append(input,count);row.append(editorWrap,ok);slot.append(row);input.focus();
      input.setSelectionRange(input.value.length,input.value.length);
    }
    card.openNoteEditor=showEdit;
    showNote();
    card.addEventListener('contextmenu',e=>{
      if(e.target.closest('.edit-row,.note-slot'))return;
      e.preventDefault();selectedId=id;
      placedEl.querySelectorAll('.card.selected').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');updateSelectionBar();
    });
    enableFreeDrag(card,id);
    placedEl.appendChild(card);
  }
  renderList();setEmpty();updateSelectionBar();
}

function boardPercent(clientX, clientY){
  const r = boardEl.getBoundingClientRect();
  return { x: ((clientX - r.left)/r.width)*100, y: ((clientY - r.top)/r.height)*100 };
}
function place(id, x, y){
  const prev = state.placements[id] || {note:''};
  // Reinsert the placement at the end: later entries render above earlier cards.
  if(Object.prototype.hasOwnProperty.call(state.placements,id)) delete state.placements[id];
  state.placements[id] = { x: clamp(x, 5, 95), y: clamp(y, 7, 93), note: prev.note || '' };
  selectedId=id; saveState(); renderPlaced();
}
function removePlacement(id){ state.oshiIds=(state.oshiIds||[]).filter(oshiId=>oshiId!==id); delete state.placements[id]; if(selectedId===id) selectedId=null; saveState(); renderPlaced(); }

function snapCardToCenter(card,targetX,targetY){
  card.style.left = targetX + '%';
  card.style.top = targetY + '%';
  const boardRect = boardEl.getBoundingClientRect();
  const avatar = card.querySelector('.avatar');
  if(!avatar || !boardRect.width || !boardRect.height){
    return {x:targetX,y:targetY,snappedX:false,snappedY:false};
  }
  const aRect = avatar.getBoundingClientRect();
  const avatarCenterX = ((aRect.left + aRect.width/2) - boardRect.left) / boardRect.width * 100;
  const avatarCenterY = ((aRect.top + aRect.height/2) - boardRect.top) / boardRect.height * 100;
  const thresholdX = Math.max(1.1, Math.min(3.2, 18 * 100 / boardRect.width));
  const thresholdY = Math.max(1.1, Math.min(3.2, 18 * 100 / boardRect.height));
  let snappedX = false, snappedY = false;
  if(Math.abs(avatarCenterX - 50) <= thresholdX){
    targetX += (50 - avatarCenterX);
    snappedX = true;
  }
  if(Math.abs(avatarCenterY - 50) <= thresholdY){
    targetY += (50 - avatarCenterY);
    snappedY = true;
  }
  targetX = clamp(targetX, 5, 95);
  targetY = clamp(targetY, 7, 93);
  card.style.left = targetX + '%';
  card.style.top = targetY + '%';
  return {x:targetX,y:targetY,snappedX,snappedY};
}
function enableFreeDrag(card,id){
  let dragging = false;
  let moved = false;
  let startClientX = 0, startClientY = 0;
  let startX = 0, startY = 0;
  let currentX = 0, currentY = 0;
  let activePointerId = null;

  card.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.iconbtn,.edit-row,.note-slot')) return;
    const pl = state.placements[id];
    if (!pl) return;
    dragging = true;
    moved = false;
    activePointerId = e.pointerId;
    startClientX = e.clientX;
    startClientY = e.clientY;
    startX = currentX = pl.x;
    startY = currentY = pl.y;
    selectedId = id;
    // Do not re-render here: removing the DOM node would cancel pointer capture.
    document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
    card.classList.add('selected');
    updateSelectionBar();
    card.setPointerCapture(activePointerId);
    e.preventDefault();
  });

  card.addEventListener('pointermove', e => {
    if (!dragging || e.pointerId !== activePointerId) return;
    const rect = boardEl.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const dx = (e.clientX - startClientX) * 100 / rect.width;
    const dy = (e.clientY - startClientY) * 100 / rect.height;
    if (!moved && (Math.abs(e.clientX-startClientX) > 2 || Math.abs(e.clientY-startClientY) > 2)) {
      moved = true;
      const topZ = Math.max(10, ...Array.from(placedEl.querySelectorAll('.card')).map(el => Number(el.style.zIndex)||0));
      card.style.zIndex = String(topZ + 1);
    }
    currentX = clamp(startX + dx, 5, 95);
    currentY = clamp(startY + dy, 7, 93);
    const snapped = snapCardToCenter(card,currentX,currentY);
    currentX = snapped.x;
    currentY = snapped.y;
  });

  function finish(e) {
    if (!dragging || e.pointerId !== activePointerId) return;
    dragging = false;
    activePointerId = null;
    if (state.placements[id]) {
      state.placements[id].x = currentX;
      state.placements[id].y = currentY;
      if(moved){
        const latestPlacement=state.placements[id];
        delete state.placements[id];
        state.placements[id]=latestPlacement;
      }
      saveState();
    }
    // A short click opens the inline editor; a real drag also moves the card to the top layer.
    if(!moved){card.openNoteEditor();}
    else {renderPlaced();}
  }
  card.addEventListener('pointerup', finish);
  card.addEventListener('pointercancel', finish);
}

// High-resolution, self-contained SNS image: draws just the quadrant, not the sidebar or buttons.
function roundRectPath(ctx,x,y,w,h,r){const k=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+k,y);ctx.arcTo(x+w,y,x+w,y+h,k);ctx.arcTo(x+w,y+h,x,y+h,k);ctx.arcTo(x,y+h,x,y,k);ctx.arcTo(x,y,x+w,y,k);ctx.closePath();}
function exportText(ctx,str,x,y,maxWidth){ctx.fillText(str,x,y,maxWidth);}
async function getPortrait(m){
  const path=avatarStore[m.id] || (AVATAR_FILES[m.id]?'avatars/'+m.id+'.webp':null);
  if(!path)return null;
  return new Promise(resolve=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>resolve(null);im.src=path;});
}
function wrapExportText(ctx,content,maxWidth,maxLines){
  const chars=Array.from(String(content||''));const rows=[];let row='';
  for(const ch of chars){if(ctx.measureText(row+ch).width>maxWidth && row){rows.push(row);row=ch;}else row+=ch;}
  if(row)rows.push(row);
  if(rows.length>maxLines){const clipped=rows.slice(0,maxLines);let last=clipped[maxLines-1];while(last && ctx.measureText(last+'…').width>maxWidth)last=last.slice(0,-1);clipped[maxLines-1]=last+'…';return clipped;}
  return rows;
}
function paintOshiOnCanvas(c, x, y, r){
  c.save();
  c.beginPath();c.arc(x,y,r+2,0,Math.PI*2);c.strokeStyle='#e2aa31';c.lineWidth=4;c.stroke();
  // Text follows a circular arc at the upper right, like the DOM SVG textPath.
  const label='神推',fontSize=Math.max(17,Math.round(r*.53));
  c.font='800 '+fontSize+'px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif';
  c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
  const pathRadius=r+15,angles=[-Math.PI*.39,-Math.PI*.20];
  [...label].forEach((ch,i)=>{
    const angle=angles[i];
    c.save();c.translate(x+Math.cos(angle)*pathRadius,y+Math.sin(angle)*pathRadius);
    c.rotate(angle+Math.PI/2);c.strokeStyle='#fff9e8';c.lineWidth=4;
    c.strokeText(ch,0,0);c.fillStyle='#bd8514';c.fillText(ch,0,0);c.restore();
  });
  c.restore();
}
// Return the actual avatar-circle center on the live board, in board-relative percentages.
function renderedAvatarPercent(id, fallback){
  const card = Array.from(placedEl.querySelectorAll('.card')).find(el => el.dataset.id === id);
  const avatar = card?.querySelector('.avatar');
  const rect = boardEl.getBoundingClientRect();
  if(avatar && rect.width > 0 && rect.height > 0){
    const a = avatar.getBoundingClientRect();
    return {
      x: ((a.left + a.width / 2 - rect.left) / rect.width) * 100,
      y: ((a.top + a.height / 2 - rect.top) / rect.height) * 100
    };
  }
  return fallback || {x: 50, y: 50};
}

async function exportQuadrantImage(){
  const btn=$('#export');const oldLabel=btn.textContent;btn.disabled=true;btn.textContent='生成图片中…';
  try{
    // Render two native SNS aspect ratios (portrait 9:16 and landscape 4:3); positions remain percentages of the quadrant.
    const vertical=$('#exportRatio').value==='portrait';
    const W=vertical?1080:1440,H=vertical?1920:1080;
    const pad=vertical?55:60,by=vertical?220:165,bh=vertical?1615:840;
    const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
    const c=canvas.getContext('2d');
    c.fillStyle='#fff';c.fillRect(0,0,W,H);
    c.fillStyle='#30343c';c.font=(vertical?'600 38px':'600 43px')+' "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    c.textAlign='left';c.fillText('VTuber Viewing Preferences',pad,vertical?88:78);
    const who=creatorInput.value.trim();
    c.fillStyle='#737780';c.font='27px "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    c.fillText('观看偏好 · 四象限',pad,vertical?139:124);
    if(who){c.textAlign='right';c.font='26px "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif';c.fillText('填表人：'+who,W-pad,vertical?187:120,vertical?W-pad*2:665);c.textAlign='left';}
    // White canvas, restrained axes, gentle frame.
    roundRectPath(c,pad,by,W-pad*2,bh,23);c.fillStyle='#fff';c.fill();c.strokeStyle='#e0e2e6';c.lineWidth=2;c.stroke();
    const bx=pad,bw=W-pad*2,cx=bx+bw/2,cy=by+bh/2;
    c.strokeStyle='#b9babd';c.fillStyle='#b9babd';c.lineWidth=2.5;
    const arrow=(x,y,angle)=>{c.save();c.translate(x,y);c.rotate(angle);c.beginPath();c.moveTo(0,0);c.lineTo(-14,-7);c.lineTo(-14,7);c.closePath();c.fill();c.restore();};
    c.beginPath();c.moveTo(cx,by+85);c.lineTo(cx,by+bh-85);c.moveTo(bx+90,cy);c.lineTo(bx+bw-90,cy);c.stroke();
    arrow(cx,by+85,-Math.PI/2);arrow(cx,by+bh-85,Math.PI/2);arrow(bx+90,cy,Math.PI);arrow(bx+bw-90,cy,0);
    c.fillStyle='#41444b';c.font='500 33px "Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';c.textAlign='center';
    const axisLabels=getAxisLabels();
    c.fillText(axisLabels.top,cx,by+52);c.fillText(axisLabels.bottom,cx,by+bh-29);
    c.save();c.translate(bx+47,cy);c.rotate(Math.PI/2);c.fillText(axisLabels.left,0,0);c.restore();
    c.save();c.translate(bx+bw-47,cy);c.rotate(Math.PI/2);c.fillText(axisLabels.right,0,0);c.restore();
    const placed=Object.entries(state.placements).filter(([id])=>memberById(id));
    const portraitList=await Promise.all(placed.map(([,pl],i)=>getPortrait(memberById(placed[i][0]))));
    // Export based on the avatar circle center actually seen on screen, so portrait-center alignment stays identical across 4:3 and 9:16.
    const rect=boardEl.getBoundingClientRect();
    const baseWidth=Math.max(1,rect.width),baseHeight=Math.max(1,rect.height);
    const sx=Math.min(1.30,bw/baseWidth),sy=Math.min(1.25,bh/baseHeight);
    const factor=Math.min(sx,sy);
    const avatarRadius=Math.max(29,Math.min(vertical?42:44,32*factor));
    const namePx=Math.max(15,Math.min(21,13*factor));
    const notePx=Math.max(14,Math.min(19,12*factor));
    for(let i=0;i<placed.length;i++){
      const [id,pl]=placed[i],m=memberById(id),portrait=portraitList[i];
      const livePos=renderedAvatarPercent(id, pl);
      const x=bx+bw*(Number(livePos.x)||0)/100;
      const y=by+bh*(Number(livePos.y)||0)/100;
      c.save();c.beginPath();c.rect(bx+2,by+2,bw-4,bh-4);c.clip();
      c.beginPath();c.arc(x,y,avatarRadius,0,Math.PI*2);c.closePath();
      c.fillStyle=avatarBackground(m,!!portrait);c.fill();
      if(portrait){c.save();c.clip();c.drawImage(portrait,x-avatarRadius,y-avatarRadius,avatarRadius*2,avatarRadius*2);c.restore();}
      else{c.fillStyle=representativeColor(m) ? representativeColor(m) : colorFromText(m.id+m.jp);c.fill();c.fillStyle='#fff';c.textAlign='center';c.font='bold 20px system-ui,sans-serif';c.fillText(avatarLabel(m),x,y+5);} 
      if(state.oshiIds.includes(id))paintOshiOnCanvas(c,x,y,avatarRadius);
      c.textAlign='center';c.fillStyle='#282c34';c.font='600 '+namePx+'px "Noto Sans SC","Noto Sans JP",system-ui,sans-serif';
      exportText(c,quadrantDisplayName(m),x,y+avatarRadius+26,175);
      const note=(pl.note||'').trim();if(note){c.font=notePx+'px "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif';c.fillStyle='#555760';let lines=wrapExportText(c,note,210,3);for(let k=0;k<lines.length;k++)c.fillText(lines[k],x,y+avatarRadius+48+k*(notePx+3));}
      c.restore();
    }
    // Dedicated credits band below the quadrant frame, separated by a fine divider.
    const innerFooterY=by+bh-14;
    c.textBaseline='alphabetic';
    c.fillStyle='rgba(112,112,120,.46)';
    c.textAlign='left';
    c.font='500 16px "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    c.fillText('篮子采购部',pad+14,innerFooterY);
    c.fillStyle='rgba(112,112,120,.42)';
    c.textAlign='right';
    c.font='14px "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    c.fillText('Made by 鸡扒',W-pad-14,innerFooterY);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if(!blob)throw new Error('PNG 创建失败');
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;
    a.download='vtuber-viewing-preferences'+(who?'-'+who.replace(/[\\/:*?"<>|]/g,'').slice(0,24):'')+(vertical?'-9x16':'-4x3')+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(err){console.error(err);alert('导出图片失败，请检查头像图片是否能正常加载，或换用 Chrome / Edge / Safari 重试。');}
  finally{btn.disabled=false;btn.textContent=oldLabel;}
}
$('#export').addEventListener('click',exportQuadrantImage);
$('#import').addEventListener('click', ()=>{ const input=document.createElement('input'); input.type='file'; input.accept='application/json'; input.onchange=async()=>{ const f=input.files?.[0]; if(!f) return; try{ const obj=JSON.parse(await f.text()); const placements=obj.placements||{};state={placements,oshiIds:normalizeOshiIds(obj,placements)}; selectedId=null; saveState(); renderPlaced(); }catch(err){ alert('导入失败：不是有效的布局文件。'); } }; input.click(); });

renderList();
renderPlaced();
</script>
