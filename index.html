<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>彩虹社四象限自由拖拽板</title>
<style>
:root{--bg:#f3f1f2;--panel:#ffffff;--ink:#262429;--muted:#76727a;--line:#ded8de;--deep:#31333a;--shadow:0 14px 36px rgba(61,53,61,.08)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Noto Sans JP","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f8f6f7,#f0edf0);color:var(--ink);overflow:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
.serif{font-family:"Baskerville","Iowan Old Style","Palatino Linotype","Noto Serif SC","Source Han Serif SC","Songti SC","STSong","KaiTi",serif}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;height:100vh;padding:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.main{background:transparent;border:none;box-shadow:none;overflow:visible}
.sidebar{display:flex;flex-direction:column;min-height:0}
.side-head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.side-head h1{display:none}
.side-head p{margin:0;font-size:13px;line-height:1.7;color:var(--muted)}
.controls{padding:12px 18px 10px;display:grid;grid-template-columns:1fr 1fr;gap:9px;border-bottom:1px solid var(--line)}
.controls input,.controls select,.controls button{width:100%;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;color:var(--ink)}
.controls .search{grid-column:1/-1}
.controls .actions{grid-column:1/-1;display:flex;gap:8px}
.list{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:0}
.member{display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#fff;transition:.15s ease}
.member:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(70,40,50,.07)}
.member.dragging{opacity:.55}
.avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;user-select:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.member .meta{min-width:0}
.member strong,.member span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member strong{font-size:14px}
.member span{font-size:12px;color:var(--muted)}
.member small{padding:2px 7px;border-radius:999px;background:#f5f0f2;color:#675f68;font-size:11px}
.main{display:flex;flex-direction:column;min-height:0;padding:10px 10px 0}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px;padding:2px 6px 0}
.topbar h2{margin:0 0 4px;font-size:19px;font-weight:600;color:#3a3940}
.topbar p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.55}
.topbar .btns{display:flex;gap:8px;flex-wrap:wrap}
.toolbtn{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;color:#403c43}
.toolbtn:hover{border-color:#d7bcc6;background:#fff9fb}
.stage{flex:1;min-height:0;display:flex;padding:0}
.board{position:relative;flex:1;width:100%;height:100%;min-height:0;background:transparent;border:none;border-radius:28px;box-shadow:none;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#f6eaf0 0 50%,#e8f0f7 50% 100%)}
.board::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0 50%,transparent 50% 100%)}
.board-frame{position:absolute;inset:0;border-radius:28px;box-shadow:inset 0 0 0 1px rgba(95,92,102,.16);pointer-events:none;z-index:1}
.board-credit{position:absolute;right:16px;bottom:11px;z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:#707078;letter-spacing:.025em}.board-credit .byline{font-size:9px;font-weight:400;opacity:.48}.board-credit .dept{font-size:12px;font-weight:400;opacity:.48}
@media(max-width:980px){.board-credit{right:10px;bottom:8px;font-size:9px;opacity:.30}}

.quad-overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0 50%,rgba(237,232,246,.92) 50% 100%),linear-gradient(90deg,transparent 0 50%,rgba(232,241,233,.92) 50% 100%);mix-blend-mode:multiply;opacity:.96}
.axis-svg{position:absolute;inset:0;pointer-events:none}
.axis-label{position:absolute;z-index:2;font-weight:600;color:var(--deep);text-shadow:none;letter-spacing:.01em;font-family:"Baskerville","Iowan Old Style","Palatino Linotype","Noto Serif SC","Source Han Serif SC","Songti SC","STSong","KaiTi",serif}
.axis-label.top{top:26px;left:50%;transform:translateX(-50%);font-size:clamp(17px,1.45vw,24px)}
.axis-label.bottom{bottom:24px;left:50%;transform:translateX(-50%);font-size:clamp(17px,1.45vw,24px)}
.axis-label.left{left:24px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:clamp(16px,1.35vw,22px)}
.axis-label.right{right:24px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:clamp(16px,1.35vw,22px)}
.board-hint{position:absolute;inset:auto 0 14px 0;text-align:center;z-index:2;color:#8f8a92;font-size:11.5px;pointer-events:none;letter-spacing:.02em}
.placed-layer{position:absolute;inset:0;z-index:4}
.card{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;min-width:92px;max-width:170px;touch-action:none;user-select:none}
.card.selected .avatar{outline:3px solid rgba(229,57,85,.18)}
.card .avatar{width:64px;height:64px;font-size:15px;box-shadow:0 8px 18px rgba(70,40,50,.12)}
.card .name{font-size:13px;font-weight:700;text-align:center;line-height:1.2;padding:0 4px;word-break:break-word}
.card .sub{font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding:0 4px}
.card .note{font-size:12px;line-height:1.35;text-align:center;color:#55545a;background:none;border:0;border-radius:0;padding:0;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:none;cursor:pointer}
.card .note-input{width:148px;min-height:46px;max-height:110px;resize:vertical;overflow:auto;border:1px solid #e4cfd9;border-radius:10px;background:rgba(255,255,255,.95);padding:6px 8px;font-size:12px;line-height:1.4;font-family:inherit;color:#49414a;text-align:left;touch-action:auto;user-select:text;outline-offset:2px;box-shadow:0 4px 12px rgba(70,40,50,.05)}.card .note-input:focus{outline:2px solid #eeafc0}.card .edit-row{display:flex;align-items:flex-start;gap:4px}.card .confirm-note{border:0;border-radius:0;padding:4px 5px;background:transparent;color:#59605f;font-weight:500;font-size:20px;cursor:pointer}.card .confirm-note:hover{color:#222}.card .tools{display:none;position:absolute;top:-12px;right:-4px;gap:4px}
.card.selected .tools{display:flex}
.iconbtn{width:26px;height:26px;border-radius:999px;border:1px solid #e6d7de;background:#fff;color:#665f68;display:grid;place-items:center;padding:0;box-shadow:0 4px 10px rgba(70,40,50,.06)}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:#8c8790;z-index:1;pointer-events:none;font-size:13px;line-height:1.7}
@media(max-width:980px){body{overflow:auto} .app{grid-template-columns:1fr;height:auto;min-height:100vh} .sidebar{max-height:40vh} .main{min-height:70vh;padding:10px 0 0} .topbar{padding:0 8px} .stage{min-height:72vh} .board{width:100%;height:100%;border-radius:22px}}

/* Editorial redesign: a quiet, unified color field and precise center-cross geometry. */
:root { --ink:#2a2d34; --muted:#737781; --line:#e6e6e8; --deep:#34373e; --shadow:0 14px 34px rgba(30,34,44,.055); }
body { background:#f7f7f8; color:var(--ink); }
.app { gap:14px; padding:14px; }
.panel.sidebar { background:#fff; border:1px solid #e8e8ea; border-radius:20px; box-shadow:0 8px 25px rgba(34,37,45,.035); }
.main { padding:5px 4px 0; }
.topbar { margin:0 0 12px; padding:6px 5px 0; align-items:center; }
.topbar h2 { margin:0 0 3px; font-size:19px; font-weight:590; letter-spacing:-.035em; color:#292d34; }
.topbar p { color:#868791; font-size:12px; line-height:1.35; max-width:690px; }
.toolbtn { border:1px solid #e2e3e6; border-radius:11px; color:#555963; font-size:12px; font-weight:500; padding:9px 13px; background:rgba(255,255,255,.76); box-shadow:0 1px 1px rgba(30,35,43,.018); }
.toolbtn:hover { background:#fff; border-color:#c9cbd0; }
.stage { display:flex; flex:1; min-height:0; padding:0; }
.board { position:relative; flex:1; width:100%; height:100%; min-height:0; border-radius:24px; overflow:hidden; background:#f4ebef; box-shadow:0 10px 30px rgba(47,47,53,.035); }
.board::before,.board::after,.quad-overlay { display:none !important; }
.board-frame { z-index:3; border-radius:24px; box-shadow:inset 0 0 0 1px rgba(40,45,52,.075); }
.quad-grid { position:absolute; inset:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; pointer-events:none; z-index:0; }
.quad { min-width:0; min-height:0; }
.q-pink { background:#f4e8ed; }
.q-blue { background:#e8eef5; }
.q-purple { background:#eee9f3; }
.q-green { background:#e7eee8; }
.axis-svg { position:absolute; inset:0; width:100%; height:100%; display:block; z-index:1; pointer-events:none; }
.axis-svg line { stroke:#555760; stroke-width:1.2; opacity:.72; }
.axis-svg marker path { fill:#555760; }
.axis-label { z-index:2; font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Hiragino Mincho ProN",serif; font-weight:500; color:#383b41 !important; letter-spacing:.09em; text-shadow:none; }
.axis-label.top { top:23px; font-size:clamp(16px,1.25vw,21px); }
.axis-label.bottom { bottom:21px; font-size:clamp(16px,1.25vw,21px); }
.axis-label.left { left:26px; font-size:clamp(15px,1.15vw,19px); }
.axis-label.right { right:26px; font-size:clamp(15px,1.15vw,19px); }
.board-hint { color:#777b84; font-size:10.5px; bottom:9px; opacity:.75; }
.empty { color:#747680; font-size:12px; line-height:1.7; }
.placed-layer { z-index:5; }
@media(max-width:980px) { .main{padding:10px 0 0} .stage{min-height:72vh} .board{border-radius:20px} .axis-label.left{left:12px}.axis-label.right{right:12px} }


/* v1455: minimal white canvas while retaining free-drag coordinates */
.board { background:#ffffff; box-shadow:0 10px 30px rgba(39,43,49,.025); }
.quad-grid .quad { background:#ffffff !important; }
.board-frame { box-shadow:inset 0 0 0 1px rgba(49,53,61,.065); }
.axis-svg line { stroke:#b9babd; stroke-width:1; opacity:.75; }
.axis-svg marker path { fill:#b9babd; }
.axis-label { color:#3c4047 !important; font-weight:500; }
.board-hint { color:#a0a2a7; }
.empty { color:#a7a9ad; }

.mobile-instruction[hidden]{display:none!important}
/* Mobile adaptation: canvas-first, searchable bottom drawer. */
.mobile-open,.drawer-handle,.drawer-backdrop,.mobile-instruction{display:none}

<body>
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="app">
  <aside class="panel sidebar" id="mobileDrawer">
    <div class="drawer-handle"></div>
    <div class="side-head">
      
      <p>选择你愿意观看的主播或直播主，拖进四象限，记录你的观看偏好。</p>
    </div>
    <div class="controls">
      <input id="search" class="search" type="search" placeholder="搜索主播：日文 / English / 中文">
      <select id="branch" aria-label="所属团体"><option value="all">全部主播</option><option value="NIJISANJI">NIJISANJI</option><option value="VSPO">VSPO!</option><option value="CR">Crazy Raccoon</option><option value="NEO">Neo-Porte</option></select>
      <select id="status"><option value="all">全部状态</option><option value="placed">只看已放置</option><option value="unplaced">只看未放置</option></select>
      <div class="actions"><button id="toggleSort">按名称排序</button><button id="help">说明</button></div>
    </div>
    <div id="list" class="list"></div>
  </aside>

  <main class="panel main">
    <div class="topbar">
      <div>
        <h2>观看偏好 · 四象限</h2>
        <p>选择主播并拖入画布，自由安排位置；点击头像可添加推荐理由。</p>
      </div>
      <div class="btns">
        <button type="button" class="mobile-open" id="mobileOpen">☰ 选主播</button>
        <button class="toolbtn" id="clear">清空布局</button>
        <button class="toolbtn" id="export">导出布局</button>
        <button class="toolbtn" id="import">导入布局</button>
      </div>
    </div>
    <div class="stage">
      <div id="board" class="board">
        <div class="board-frame"></div>
        <div class="quad-grid" aria-hidden="true"><div class="quad q-pink"></div><div class="quad q-blue"></div><div class="quad q-purple"></div><div class="quad q-green"></div></div>
        
        <div class="board-credit" aria-hidden="true"><span class="byline">Made by 鸡扒</span><span class="dept">篮子采购部</span></div>
        <svg class="axis-svg" viewBox="0 0 1000 760" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <marker id="arrowEnd" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill="#555760"></path>
            </marker>
          </defs>
          <line x1="500" y1="54" x2="500" y2="706" stroke="#555760" stroke-width="1.2" marker-start="url(#arrowEnd)" marker-end="url(#arrowEnd)"/>
          <line x1="70" y1="380" x2="930" y2="380" stroke="#555760" stroke-width="1.2" marker-start="url(#arrowEnd)" marker-end="url(#arrowEnd)"/>
        </svg>
        <div class="axis-label top">随时都能看</div>
        <div class="axis-label bottom">有空时再慢慢看</div>
        <div class="axis-label left">更适合深度观众</div>
        <div class="axis-label right">也推荐给大众</div>
        <div id="empty" class="empty">把左侧主播卡拖到这里开始排布。<br>放进去以后可以在四象限上任意拖动到你想要的位置。</div>
        <div id="placed" class="placed-layer"></div>
        <div class="mobile-instruction" id="mobileInstruction" hidden>点击画布放置所选主播</div>
        <div class="board-hint">提示：按住头像自由拖动位置；点击头像可编辑推荐理由。</div>
      </div>
    </div>
  </main>
</div>

const STORAGE_KEY = 'nijisanji-free-board-v3';
let state = loadState();
let selectedId = null;
let asc = true;
let mobilePickedId = null;
const $ = s => document.querySelector(s);
const listEl = $('#list');
const boardEl = $('#board');
const placedEl = $('#placed');
const emptyEl = $('#empty');
const drawerEl=$('#mobileDrawer');
const backdropEl=$('#drawerBackdrop');
const mobileInstruction=$('#mobileInstruction');
const isMobile=()=>window.matchMedia('(max-width:980px)').matches;
function openDrawer(){drawerEl.classList.add('is-open');backdropEl.classList.add('is-open');}
function closeDrawer(){drawerEl.classList.remove('is-open');backdropEl.classList.remove('is-open');}
function updateMobilePick(){mobileInstruction.hidden=!(isMobile() && mobilePickedId); if(mobilePickedId){const m=memberById(mobilePickedId);mobileInstruction.textContent='点击画布放置：'+(m?.jp||'主播');}}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return {placements:{}};
    const obj = JSON.parse(raw);
    return {placements: obj.placements || {}};
  }catch(e){return {placements:{}};}
}
function saveState(){localStorage.setItem(STORAGE_KEY, JSON.stringify(state));}
function normalize(s){return (s||'').toString().toLowerCase().normalize('NFKC').replace(/[\s\-_.·・]/g,'');}
function escapeHtml(str){return (str??'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function searchBlob(m){return normalize([m.jp,m.en,m.cn,...(m.aliases||[])].join(' '));}
function colorFromText(t){let h=0; for(const ch of t) h=(h*31 + ch.codePointAt(0))%360; return `hsl(${h}, 62%, 56%)`;}
function avatarLabel(m){if(m.en){const p=m.en.replace(/[^A-Za-z\s]/g,'').trim().split(/\s+/).filter(Boolean); if(p.length>=2) return (p[0][0]+p[1][0]).toUpperCase(); if(p.length===1) return p[0].slice(0,2).toUpperCase();} return (m.jp||m.cn||'?').replace(/[\s・·]/g,'').slice(0,2);}
function avatarHtml(m){
  const localPath = AVATAR_FILES[m.id] ? 'avatars/' + m.id + '.webp' : '';
  const src = avatarStore[m.id] || localPath;
  const label = escapeHtml(avatarLabel(m));
  return src ? `<img src="${escapeHtml(src)}" alt="${escapeHtml(m.jp)}" loading="lazy" onerror="this.remove();this.parentElement.textContent='${label}'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : label;
}
function loadAvatars(){try{return JSON.parse(localStorage.getItem('nijisanji-avatar-images-v1') || '{}')}catch(e){return {}}}
const avatarStore = loadAvatars();
function memberById(id){return MEMBERS.find(m=>m.id===id);}
function clamp(v,min,max){return Math.max(min, Math.min(max,v));}
function setEmpty(){emptyEl.style.display = Object.keys(state.placements).length ? 'none' : 'grid';}

function renderList(){
  const q = normalize($('#search').value);
  const branch = $('#branch').value;
  const status = $('#status').value;
  let arr=[...MEMBERS].sort((a,b)=>{
    const ka=normalize(a.jp||a.en||a.cn); const kb=normalize(b.jp||b.en||b.cn);
    return asc ? ka.localeCompare(kb,'ja') : kb.localeCompare(ka,'ja');
  });
  listEl.innerHTML='';
  for(const m of arr){
    const placed = !!state.placements[m.id];
    if(q && !searchBlob(m).includes(q)) continue;
    if(branch!=='all' && (branch==='NIJISANJI' ? !['JP','EN'].includes(m.branch) : m.branch!==branch)) continue;
    if(status==='placed' && !placed) continue;
    if(status==='unplaced' && placed) continue;
    const el=document.createElement('div');
    el.className='member';
    el.draggable=true;
    el.dataset.id=m.id;
    if(mobilePickedId===m.id)el.classList.add('is-picked');
    el.addEventListener('click',()=>{if(!isMobile())return;mobilePickedId=m.id;closeDrawer();updateMobilePick();});
    el.innerHTML=`<div class="avatar" style="background:${colorFromText(m.id+m.jp)}">${avatarHtml(m)}</div>
      <div class="meta"><strong>${escapeHtml(m.jp)}</strong><span>${escapeHtml(m.en||m.cn||'—')}</span></div>
      <small>${placed?'已放置':(m.branch==='JP'||m.branch==='EN'?'NIJI '+m.branch:m.branch==='VSPO'?'VSPO!':m.branch==='NEO'?'Neo-Porte':'CR')}</small>`;
    el.addEventListener('contextmenu', e=>{e.preventDefault();uploadAvatar(m.id);});
    el.addEventListener('dragstart', e=>{el.classList.add('dragging'); e.dataTransfer.setData('text/plain', m.id);});
    el.addEventListener('dragend', ()=>el.classList.remove('dragging'));
    listEl.appendChild(el);
  }
}

function uploadAvatar(id){
  const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='image/*';
  fileInput.addEventListener('change',()=>{
    const file=fileInput.files?.[0];if(!file)return;
    if(file.size>3*1024*1024){alert('请上传小于 3 MB 的头像。');return;}
    const reader=new FileReader();reader.onload=()=>{
      avatarStore[id]=String(reader.result);
      try{localStorage.setItem('nijisanji-avatar-images-v1',JSON.stringify(avatarStore));renderPlaced();}
      catch(e){delete avatarStore[id];alert('浏览器本地存储空间不足，请尝试更小的头像图片。');}
    };reader.readAsDataURL(file);
  });fileInput.click();
}
function renderPlaced(){
  placedEl.innerHTML='';
  for(const [id,pl] of Object.entries(state.placements)){
    const m=memberById(id); if(!m) continue;
    const card=document.createElement('div');
    card.className='card'+(selectedId===id?' selected':'');
    card.dataset.id=id;
    card.style.left=pl.x+'%'; card.style.top=pl.y+'%';
    card.innerHTML=`<div class="tools"><button class="iconbtn remove" title="移除">×</button></div>
      <div class="avatar" style="background:${colorFromText(m.id+m.jp)}">${avatarHtml(m)}</div>
      <div class="name">${escapeHtml(m.jp)}</div>
      <div class="sub">${escapeHtml(m.en||m.cn||'')}</div>
      <div class="note-slot"></div>`;
    card.querySelector('.remove').addEventListener('click',e=>{e.stopPropagation();removePlacement(id);});
    const slot=card.querySelector('.note-slot');
    function showNote(){
      slot.innerHTML='';
      if(card.editAbort)card.editAbort.abort();
      const label=document.createElement('div');
      label.className='note';
      label.textContent=state.placements[id]?.note||'';
      label.title='点击编辑推荐理由';
      label.addEventListener('pointerdown',e=>e.stopPropagation());
      label.addEventListener('click',e=>{e.stopPropagation();showEdit();});
      slot.appendChild(label);
    }
    function showEdit(){
      slot.innerHTML='';
      const row=document.createElement('div');row.className='edit-row';
      if(card.editAbort)card.editAbort.abort();
      const editAbort=new AbortController();card.editAbort=editAbort;
      const input=document.createElement('input');input.className='note-input';input.type='text';
      input.maxLength=300;input.value=state.placements[id]?.note||'';input.placeholder='输入推荐理由…';
      const ok=document.createElement('button');ok.className='confirm-note';ok.textContent='√';ok.title='保存';
      let finished=false;
      function save(){if(finished)return;finished=true;editAbort.abort();if(!state.placements[id])return;state.placements[id].note=input.value.trim();saveState();showNote();}
      function onOutside(e){if(!row.contains(e.target))save();}
      document.addEventListener('pointerdown',onOutside,{capture:true,signal:editAbort.signal});
      input.addEventListener('blur',()=>setTimeout(()=>{if(!row.contains(document.activeElement))save();},0));
      input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save();}if(e.key==='Escape'){e.preventDefault();editAbort.abort();showNote();}});
      ok.addEventListener('click',e=>{e.stopPropagation();save();});
      for(const el of [row,input,ok])el.addEventListener('pointerdown',e=>e.stopPropagation());
      row.append(input,ok);slot.append(row);input.focus();input.select();
    }
    card.openNoteEditor=showEdit;
    showNote();
    enableFreeDrag(card,id);
    placedEl.appendChild(card);
  }
  renderList();setEmpty();
}

function boardPercent(clientX, clientY){
  const r = boardEl.getBoundingClientRect();
  return { x: ((clientX - r.left)/r.width)*100, y: ((clientY - r.top)/r.height)*100 };
}
function place(id, x, y){
  const prev = state.placements[id] || {note:''};
  state.placements[id] = { x: clamp(x, 5, 95), y: clamp(y, 7, 93), note: prev.note || '' };
  selectedId=id; saveState(); renderPlaced();
}
function removePlacement(id){ delete state.placements[id]; if(selectedId===id) selectedId=null; saveState(); renderPlaced(); }
function enableFreeDrag(card,id){
  let dragging = false;
  let moved = false;
  let startClientX = 0, startClientY = 0;
  let startX = 0, startY = 0;
  let currentX = 0, currentY = 0;
  let activePointerId = null;

  card.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.iconbtn,.edit-row,.note-slot')) return;
    const pl = state.placements[id];
    if (!pl) return;
    dragging = true;
    moved = false;
    activePointerId = e.pointerId;
    startClientX = e.clientX;
    startClientY = e.clientY;
    startX = currentX = pl.x;
    startY = currentY = pl.y;
    selectedId = id;
    // Do not re-render here: removing the DOM node would cancel pointer capture.
    document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
    card.classList.add('selected');
    card.setPointerCapture(activePointerId);
    e.preventDefault();
  });

  card.addEventListener('pointermove', e => {
    if (!dragging || e.pointerId !== activePointerId) return;
    const rect = boardEl.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const dx = (e.clientX - startClientX) * 100 / rect.width;
    const dy = (e.clientY - startClientY) * 100 / rect.height;
    if (Math.abs(e.clientX-startClientX) > 2 || Math.abs(e.clientY-startClientY) > 2) moved = true;
    currentX = clamp(startX + dx, 5, 95);
    currentY = clamp(startY + dy, 7, 93);
    card.style.left = currentX + '%';
    card.style.top = currentY + '%';
  });

  function finish(e) {
    if (!dragging || e.pointerId !== activePointerId) return;
    dragging = false;
    activePointerId = null;
    if (state.placements[id]) {
      state.placements[id].x = currentX;
      state.placements[id].y = currentY;
      saveState();
    }
    // A short click opens the inline editor; movement preserves drag behavior.
    if(!moved){card.openNoteEditor();}
    else {renderPlaced();}
  }
  card.addEventListener('pointerup', finish);
  card.addEventListener('pointercancel', finish);
}

$('#mobileOpen').addEventListener('click',openDrawer);
backdropEl.addEventListener('click',closeDrawer);
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
boardEl.addEventListener('pointerup',e=>{if(!isMobile()||!mobilePickedId)return; if(e.target.closest('.card'))return; const p=boardPercent(e.clientX,e.clientY); const id=mobilePickedId;mobilePickedId=null;updateMobilePick();place(id,p.x,p.y);});
boardEl.addEventListener('dragover', e=>e.preventDefault());
boardEl.addEventListener('drop', e=>{ e.preventDefault(); const id=e.dataTransfer.getData('text/plain'); if(!id) return; const p=boardPercent(e.clientX,e.clientY); place(id,p.x,p.y); });
$('#search').addEventListener('input', renderList);
$('#branch').addEventListener('change', renderList);
$('#status').addEventListener('change', renderList);
$('#toggleSort').addEventListener('click', ()=>{asc=!asc; renderList();});
$('#help').addEventListener('click', ()=>{alert(`使用说明：
1. 左侧列表可以单独滚动。
2. 把主播卡拖进右侧四象限。
3. 放进去之后，可以继续在四象限上任意自由拖动。
4. 点击头像编辑理由，回车、点 √ 或点击框外保存。\n5. 在左侧成员上右键，可上传自选头像。
6. 布局自动保存在当前浏览器。`);});
$('#clear').addEventListener('click', ()=>{ if(!confirm('确定清空所有已放置的卡片吗？')) return; state.placements={}; selectedId=null; saveState(); renderPlaced(); });
$('#export').addEventListener('click', ()=>{ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nijisanji-board-layout.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); });
$('#import').addEventListener('click', ()=>{ const input=document.createElement('input'); input.type='file'; input.accept='application/json'; input.onchange=async()=>{ const f=input.files?.[0]; if(!f) return; try{ const obj=JSON.parse(await f.text()); state={placements:obj.placements||{}}; selectedId=null; saveState(); renderPlaced(); }catch(err){ alert('导入失败：不是有效的布局文件。'); } }; input.click(); });

renderList();
renderPlaced();
</script>
